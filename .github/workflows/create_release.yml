name: Create Release
run-name: ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build_plugin:
    name: Build All Plugins
    uses: ./.github/workflows/build_plugin.yml

  create_release:
    name: Create Draft Release
    needs: [build_plugin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MAJOR: ${{ needs.build_plugin.outputs.version_major }}
      MINOR: ${{ needs.build_plugin.outputs.version_minor }}
      LINUX_PLUGIN_NAME: wireshark-smf-linux-x86_64.tar.gz
      WINDOWS_PLUGIN_NAME: wireshark-smf-windows-x64.zip
      MACOS_PLUGIN_NAME: wireshark-smf-macos-arm64.tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: .github/workflows/docs/release_instructions.md
          sparse-checkout-cone-mode: false

      - name: Generate Release Notes
        run: >-
          sed -e "s/@MAJOR@/$MAJOR/g" -e "s/@MINOR@/$MINOR/g"
          .github/workflows/docs/release_instructions.md > "$RUNNER_TEMP/release_notes.md"

      # The only way to share artifacts between workflows is to upload and download them.
      - name: Download Artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ARCHIVES=("$LINUX_PLUGIN_NAME"/* "$WINDOWS_PLUGIN_NAME"/* "$MACOS_PLUGIN_NAME"/*)
          NOTES="$RUNNER_TEMP/release_notes.md"

          case "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" in
            "")
              gh release create "$TAG" --draft --title "$TAG" --notes-file "$NOTES" "${ARCHIVES[@]}" ;;
            true)
              gh release edit "$TAG" --notes-file "$NOTES"
              gh release upload "$TAG" --clobber "${ARCHIVES[@]}" ;;
            *)
              echo "::error title=Release already published::$TAG is published and will not be modified"
              exit 1 ;;
          esac
