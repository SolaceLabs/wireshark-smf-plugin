name: Create Release
run-name: ${{ format('{0} patch {1}', github.ref_name, inputs.version_patch) }}

on:
  workflow_dispatch:
    inputs:
      version_patch:
        description: "Patch version for the SMF plugin"
        type: number
        required: true

env:
  LINUX_PLUGIN_NAME: wireshark-smf-linux-x86_64.tar.gz
  WINDOWS_PLUGIN_NAME: wireshark-smf-windows-x64.zip
  MACOS_PLUGIN_NAME: wireshark-smf-macos-arm64.tar.gz

jobs:
  build_plugin:
    name: Build All Plugins
    uses: ./.github/workflows/build_plugin.yml
    with:
      version_patch: ${{ fromJSON(inputs.version_patch) }}

  create_release:
    name: Create Draft Release
    runs-on: ubuntu-latest
    needs: [build_plugin]
    env:
      VERSION: ${{ needs.build_plugin.outputs.version_major }}.${{ needs.build_plugin.outputs.version_minor }}.${{ inputs.version_patch }}
      INSTRUCTIONS: .github/workflows/docs/wireshark_smf_${{ needs.build_plugin.outputs.version_major }}-${{ needs.build_plugin.outputs.version_minor }}-x_instructions.md
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: ${{ env.INSTRUCTIONS }}

      # The only way to share artifacts between workflows is to upload and download them.
      - name: Download Artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5

      - name: Create Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
            name: "v${{ env.VERSION }}"
            tag: "v${{ env.VERSION }}"
            artifacts: "${{ env.LINUX_PLUGIN_NAME }}/*, ${{ env.WINDOWS_PLUGIN_NAME }}/*, ${{ env.MACOS_PLUGIN_NAME }}/*"
            bodyFile: "${{ github.workspace }}/${{ env.INSTRUCTIONS }}"
            draft: true
