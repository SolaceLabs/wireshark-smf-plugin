name: Build Plugin

on:
  push:
    branches:
      - main

  workflow_call:
    outputs:
      version_major:
        value: ${{ jobs.setup.outputs.version_major }}
      version_minor:
        value: ${{ jobs.setup.outputs.version_minor }}

  workflow_dispatch:
    inputs:
      build_linux:
        description: 'Build for Linux'
        type: boolean
        default: true
      build_windows:
        description: 'Build for Windows'
        type: boolean
        default: true
      build_macos:
        description: 'Build for MacOS'
        type: boolean
        default: true

jobs:
  setup:
    name: Setup Build Parameters
    runs-on: ubuntu-latest
    outputs:
      wireshark_version: ${{ steps.defaults.outputs.wireshark_version }}
      version_major: ${{ steps.defaults.outputs.version_major }}
      version_minor: ${{ steps.defaults.outputs.version_minor }}
      version_patch: ${{ steps.defaults.outputs.version_patch }}
      build_linux: ${{ steps.defaults.outputs.build_linux }}
      build_windows: ${{ steps.defaults.outputs.build_windows }}
      build_macos: ${{ steps.defaults.outputs.build_macos }}
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: cmake/WiresharkVersion.cmake
          sparse-checkout-cone-mode: false

      - name: Set defaults
        id: defaults
        env:
          BUILD_LINUX: ${{ !contains(inputs.build_linux, 'false') }}
          BUILD_WINDOWS: ${{ !contains(inputs.build_windows, 'false') }}
          BUILD_MACOS: ${{ !contains(inputs.build_macos, 'false') }}
        run: |
          WIRESHARK_VERSION=$(cmake -P cmake/WiresharkVersion.cmake 2>&1)
          IFS=. read -r MAJOR MINOR _ <<< "$WIRESHARK_VERSION"

          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error title=Invalid release tag::Release tags must be vMAJOR.MINOR.PATCH, got '$GITHUB_REF_NAME'"
              exit 1
            fi
            if [[ "${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" != "$MAJOR.$MINOR" ]]; then
              echo "::error title=Tag does not match Wireshark version::Tag $GITHUB_REF_NAME does not match WIRESHARK_TARGET_VERSION $WIRESHARK_VERSION in cmake/WiresharkVersion.cmake"
              exit 1
            fi
            PATCH=${BASH_REMATCH[3]}
          else
            PATCH=-1
          fi

          echo "wireshark_version=$WIRESHARK_VERSION" >> $GITHUB_OUTPUT
          echo "version_major=$MAJOR" >> $GITHUB_OUTPUT
          echo "version_minor=$MINOR" >> $GITHUB_OUTPUT
          echo "version_patch=$PATCH" >> $GITHUB_OUTPUT

          echo "build_linux=$BUILD_LINUX" >> $GITHUB_OUTPUT
          echo "build_windows=$BUILD_WINDOWS" >> $GITHUB_OUTPUT
          echo "build_macos=$BUILD_MACOS" >> $GITHUB_OUTPUT

      - name: Set OS Matrix
        id: set-matrix
        run: |
          ALL_OS='[
            {
              "name": "linux",
              "pretty-name": "Linux",
              "runner": "ubuntu-22.04",
              "deps": "sudo apt-get update && sudo apt-get install -y ninja-build libglib2.0-dev xz-utils zlib1g-dev",
              "artifact": "wireshark-smf-linux-x86_64.tar.gz"
            },
            {
              "name": "windows",
              "pretty-name": "Windows",
              "runner": "windows-2022",
              "artifact": "wireshark-smf-windows-x64.zip"
            },
            {
              "name": "macos",
              "pretty-name": "MacOS",
              "runner": "macos-14",
              "deps": "brew install glib ninja pkgconf",
              "artifact": "wireshark-smf-macos-arm64.tar.gz"
            }
          ]'

          MATRIX=$(echo "$ALL_OS" | jq -c '[.[] | select(
            (.name == "linux" and "${{ steps.defaults.outputs.build_linux }}" == "true") or
            (.name == "windows" and "${{ steps.defaults.outputs.build_windows }}" == "true") or
            (.name == "macos" and "${{ steps.defaults.outputs.build_macos }}" == "true")
          )]')

          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build_plugin:
    needs: setup
    strategy:
      matrix:
        os: ${{ fromJSON(needs.setup.outputs.matrix) }}
    name: Build on ${{ matrix.os.pretty-name }}
    runs-on: ${{ matrix.os.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup MSVC Environment
        if: matrix.os.name == 'windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Install Dependencies
        if: matrix.os.deps
        run: ${{ matrix.os.deps }}

      - name: Cache Wireshark SDK
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/_deps
          key: wireshark-sdk-v${{ needs.setup.outputs.wireshark_version }}-${{ matrix.os.name }}-${{ hashFiles('cmake/scripts/*') }}

      - name: Configure Plugin
        run: >-
          cmake -G Ninja -S . -B build
          -DCMAKE_BUILD_TYPE="RelWithDebInfo"
          -DUSE_SYSTEM_WIRESHARK=OFF
          -DPLUGIN_VERSION_PATCH=${{ needs.setup.outputs.version_patch }}

      - name: Build Plugin
        run: cmake --build build

      - name: Create Compressed Tarball
        if: matrix.os.name == 'linux' || matrix.os.name == 'macos'
        run: tar -czvf ${{ matrix.os.artifact }} -C build smf.so

      - name: Create ZIP Archive
        if: matrix.os.name == 'windows'
        run: Get-ChildItem -Path build/smf.dll, build/smf.pdb | Compress-Archive -DestinationPath ${{ matrix.os.artifact }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.os.artifact }}
          path: ${{ matrix.os.artifact }}
          overwrite: true
