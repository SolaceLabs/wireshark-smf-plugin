name: SCA Scan
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

jobs:
  sca_scan:
    # Needs org secrets (FOSSA_API_KEY), so only run in SolaceLabs itself: forks
    # of this repo have no such secrets, and fork PRs never receive secrets and
    # get a read-only token. Fork changes are scanned on the push to main.
    if: >-
      github.repository_owner == 'SolaceLabs'
      && (github.event_name != 'pull_request'
          || (github.event.pull_request.head.repo.owner.login == 'SolaceLabs'
              && github.event.pull_request.head.repo.name == github.event.repository.name))
    # zizmor: ignore[unpinned-uses] -- reusable workflows are tracked by branch (#57)
    uses: SolaceDev/solace-public-workflows/.github/workflows/sca-scan-and-guard.yaml@main
    permissions:
      contents: read
      id-token: write
      packages: read
      actions: read
      statuses: write
      checks: write
      pull-requests: write
    secrets:
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}

  update_manifest:
    needs: sca_scan
    # The manifest records what landed on the default branch, so it must never
    # be written from a PR run -- the scan still runs, the write does not.
    # Needs MANIFEST_AWS_ROLE, so SolaceLabs only (see sca_scan).
    if: >-
      github.repository_owner == 'SolaceLabs'
      && needs.sca_scan.result == 'success'
      && github.event_name == 'push'
      && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.MANIFEST_AWS_ROLE }}
          aws-region: us-east-1

      - name: Update solace-cloud-manifest
        uses: SolaceDev/solace-public-workflows/.github/actions/cicd-helper@c689e87fd881013c2e5009bf6e751b49cae7527b # main
        with:
          rc_step: add_item_from_json_to_dynamodb_table
          ddb_table_name: solace-cloud-manifest
          ddb_partition_key: squad
          ddb_sort_key: repository
          ddb_item_to_be_added: |
            {
              "squad": "api",
              "repository": "${{ github.event.repository.name }}",
              "dev": {
                "sha": "${{ github.sha }}",
                "version": "${{ github.ref_name }}"
              }
            }
