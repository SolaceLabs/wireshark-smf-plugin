name: SCA Scan

# PRs run on pull_request_target so fork PRs can reach the FOSSA key at all
# (pull_request never hands secrets to a fork); the workflow definition then
# always comes from main. The scan job runs in a GitHub Environment that holds
# FOSSA_API_KEY (from Vault secret/tools/githubactions):
#   sca-scan       same-repo PRs and pushes to main, no approval
#   sca-scan-fork  fork PRs, a maintainer/admin must approve each run
on:
  # zizmor: ignore[dangerous-triggers] -- needed for fork PR secrets; gated by
  # the sca-scan-fork Environment and the PR head is only statically analysed.
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

permissions: {}

jobs:
  sca_scan:
    # zizmor: ignore[unpinned-uses] -- reusable workflows are tracked by branch (#57)
    uses: SolaceDev/solace-public-workflows/.github/workflows/sca-scan-and-guard.yaml@main
    permissions:
      contents: read
      id-token: write
      packages: read
      actions: read
      statuses: write
      checks: write
      pull-requests: write
    with:
      environment: >-
        ${{ github.event_name == 'pull_request_target'
            && github.event.pull_request.head.repo.full_name != github.repository
            && 'sca-scan-fork' || 'sca-scan' }}
      # The PR head is untrusted: pin the FOSSA endpoint (overrides any
      # .fossa.yml `server:`) and don't let FOSSA run third-party build tools.
      additional_scan_params: |
        fossa.endpoint=https://app.fossa.com
        fossa.static_only_analysis=true
    secrets:
      # Passed by name so the Environment's FOSSA_API_KEY takes precedence.
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}

  update_manifest:
    needs: sca_scan
    # The manifest records what landed on the default branch, so it must never
    # be written from a PR run -- the scan still runs, the write does not.
    if: >-
      needs.sca_scan.result == 'success'
      && github.event_name == 'push'
      && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.MANIFEST_AWS_ROLE }}
          aws-region: us-east-1

      - name: Update solace-cloud-manifest
        uses: SolaceDev/solace-public-workflows/.github/actions/cicd-helper@c689e87fd881013c2e5009bf6e751b49cae7527b # main
        with:
          rc_step: add_item_from_json_to_dynamodb_table
          ddb_table_name: solace-cloud-manifest
          ddb_partition_key: squad
          ddb_sort_key: repository
          ddb_item_to_be_added: |
            {
              "squad": "api",
              "repository": "${{ github.event.repository.name }}",
              "dev": {
                "sha": "${{ github.sha }}",
                "version": "${{ github.ref_name }}"
              }
            }
